<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9eff5">
  <title>bevy-crosshair</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>bevy-crosshair</h1>
    <nav aria-label="Project"><a href="api/bevy_crosshair/">Rust API</a><a href="https://github.com/sagan-software/bevy-crosshair">GitHub</a></nav>
  </header>
  <main>
    <section class="preview" aria-label="Live crosshair preview">
      <div class="preview-bar"><button id="browse" disabled>Browse 100</button><span id="style-name">Dynamic quad</span><button id="regenerate" hidden>Generate 100</button><span class="measurement"><output id="fps">Starting</output><span id="frame-time"></span></span></div>
      <div class="preview-tools">
        <label for="background">Background</label>
        <select id="background">
          <option value="solid">Solid</option>
          <option value="cs2-dust2" data-image="https://cdn.fastly.steamstatic.com/apps/csgo/images/csgo_react/cs2/maps/dust2_ct_ramp_s2.jpg" data-source="https://www.counter-strike.net/cs2" data-credit="Valve">CS2 · Dust II</option>
          <option value="cs2-overpass" data-image="https://cdn.fastly.steamstatic.com/apps/csgo/images/csgo_react/cs2/maps/overpass_lower_tunnel_s2.jpg" data-source="https://www.counter-strike.net/cs2" data-credit="Valve">CS2 · Overpass</option>
          <option value="valorant-ascent" data-image="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/93f5b5f274df64d938051c4ca8577995190e711a-914x514.jpg?accountingTag=VAL" data-source="https://playvalorant.com/en-us/maps/" data-credit="Riot Games">VALORANT · Ascent</option>
          <option value="valorant-icebox" data-image="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/91422206c56df7177495b96a26021d6379de8079-1980x1083.jpg?accountingTag=VAL&amp;fm=webp&amp;w=1280&amp;q=85" data-source="https://playvalorant.com/en-us/maps/" data-credit="Riot Games">VALORANT · Icebox</option>
          <optgroup label="Wolfenstein: Enemy Territory">
            <option value="et-goldrush" data-image="https://www.markfry.tv/wp-content/uploads/2022/08/LD_wet_shot0026.jpg" data-source="https://www.markfry.tv/level-design/wolfenstein-enemy-territory/" data-credit="Mark Fry">Enemy Territory · Gold Rush</option>
            <option value="et-fueldump" data-image="https://www.markfry.tv/wp-content/uploads/2022/08/LD_wet_shot0015.jpg" data-source="https://www.markfry.tv/level-design/wolfenstein-enemy-territory/" data-credit="Mark Fry">Enemy Territory · Fuel Dump</option>
            <option value="et-railgun" data-image="https://www.markfry.tv/wp-content/uploads/2022/08/LD_wet_shot0042.jpg" data-source="https://www.markfry.tv/level-design/wolfenstein-enemy-territory/" data-credit="Mark Fry">Enemy Territory · Rail Gun</option>
          </optgroup>
          <optgroup label="Dirty Bomb">
            <option value="db-vault" data-image="https://mmoculture.com/wp-content/uploads/2017/07/Dirty-Bomb-Vault-map-screenshot-1.jpg" data-source="https://mmoculture.com/2017/07/dirty-bomb-first-new-mercenary-added-after-separating-from-nexon/" data-credit="MMO Culture">Dirty Bomb · Vault</option>
            <option value="db-dockyard" data-image="https://static.wixstatic.com/media/997932_d6432f0bf326440683f615d7251bd010~mv2.jpg" data-source="https://geekstuffpod.wixsite.com/geek-blender/single-post/2017/05/26/dirty-bomb-ya-tiene-nuevo-mapa-dockyard" data-credit="Geek Blender">Dirty Bomb · Dockyard</option>
            <option value="db-chapel" data-image="https://cdn.mos.cms.futurecdn.net/cfd029ae3df94390fcde9560ad239957.jpg" data-source="https://www.pcgamer.com/dirty-bomb-review-beta/" data-credit="PC Gamer">Dirty Bomb · Chapel</option>
          </optgroup>
        </select>
        <a id="background-credit" target="_blank" rel="noopener noreferrer" hidden></a>
      </div>
      <div id="preview-context" hidden><span id="context-status" role="status"></span><button id="aim-normal">Reset simulation</button></div>
      <div class="viewport" id="viewport"><div id="render-stage"><canvas id="crosshair" aria-label="Bevy crosshair renderer. Use the settings panel to change its appearance."></canvas><div id="gallery-grid" aria-label="Random crosshairs" hidden></div></div><div id="loading" role="status">Loading renderer…</div><p id="background-status" role="status" hidden></p></div>
      <div class="preview-actions"><button id="fire" class="primary" disabled>Fire</button><label class="check"><input id="sound" type="checkbox">Hit sound</label><span id="receipt" role="status">No hits</span></div>
      <p id="error" role="alert" hidden></p>
    </section>
    <section class="editor" aria-label="Crosshair settings">
      <div class="tabs" role="tablist" aria-label="Settings category">
        <button role="tab" aria-selected="true" aria-controls="shape" id="tab-shape">Crosshair</button>
        <button role="tab" aria-selected="false" aria-controls="hit" id="tab-hit" tabindex="-1">Hits</button>
        <button role="tab" aria-selected="false" aria-controls="game" id="tab-game" tabindex="-1">Simulation</button>
        <button role="tab" aria-selected="false" aria-controls="config" id="tab-config" tabindex="-1">Config</button>
      </div>
      <div id="shape" role="tabpanel" aria-labelledby="tab-shape" class="panel"></div>
      <div id="hit" role="tabpanel" aria-labelledby="tab-hit" class="panel" hidden></div>
      <div id="game" role="tabpanel" aria-labelledby="tab-game" class="panel" hidden></div>
      <div id="config" role="tabpanel" aria-labelledby="tab-config" class="panel" hidden>
        <label for="configuration">CS2 console settings</label>
        <textarea id="configuration" spellcheck="false" rows="18"></textarea>
        <div class="button-row"><button id="apply">Apply</button><button id="copy">Copy</button><button id="reset">Reset defaults</button></div>
        <p class="note">Current CS2 1.41.9.0 settings. <a href="https://github.com/sagan-software/bevy-crosshair/blob/main/docs/cs2.md">Compatibility notes</a></p>
        <p class="note">Fill, dot shape, and hit-marker options are plugin extensions. CS2 console text does not include them.</p>
      </div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
