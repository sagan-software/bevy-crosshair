name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      XDG_RUNTIME_DIR: /tmp/crosshair-runtime
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Rust and Vulkan software rendering
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libvulkan1 mesa-vulkan-drivers
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --all-features
      - run: cargo test --doc --all-features
      - name: Install coverage tooling
        run: cargo install --locked cargo-llvm-cov --version 0.9.0
      - name: Test coverage
        run: bash scripts/coverage.sh test
      - name: Benchmark execution coverage
        run: bash scripts/coverage.sh bench
      - name: Criterion timings
        run: cargo bench --all-features --bench crosshair
  dylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - run: nix run .#lint-probe
      - run: nix run .#dylint
      - run: nix flake check
